<head>

    <title>Expense - Register</title>
</head>
<body>
    <div class="container">
        <h1>Login Page</h1>
        <form id="registerForm">
            <label>Enter Your Name : </label>

        </form>
    </div>
     <script src="../js/register.js"></script>
