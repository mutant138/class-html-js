<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense - Login</title>
    <style>
        .container{
            border: 2px solid black;
            text-align: center;
            margin-top: 20%;
        }
        button{
            display: block;
            margin-left: 50%;
        }
         input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .form-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
         button[type="submit"] {
            background-color: #16a34a;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #15803d;
        }
        .box{
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login Page</h1>
        <form id="loginForm">
            <label>Enter email id : </label>
            <input type="email" id="userEmail" name="userEmail"><br><br>
             <label>Enter password :</label>
            <input type="password" id="userPass", name="userPass"><br><br>
            <div class="box">
            <button type="submit">Login</button>
            <a href="http://localhost:3000/auth/register">
            <span>New User</span>
            </a>
            </div>
        </form>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
