<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense - Login</title>
    <style>
        .container{
            border: 2px solid black;
            text-align: center;
        }
        button{
            display: block;
            margin-left: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login Page</h1>
        <form>
            <label>Enter email id : </label>
            <input type="email" id="userEmail" name="userEmail"><br><br>
             <label>Enter password :</label>
            <input type="password" id="userPass", name="userPass"><br><br>
            <button type="submit">Login</button>
            <a href="http://localhost:3000/auth/register">
            <span>New User</span>
            </a>
        </form>
    </div>
    <script src="../js/login.js"></script>
</body>
</html>
